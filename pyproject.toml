[project]
name = "opspilot"
version = "0.1.0"
description = "Local-first cloud-native application delivery and intelligent operations platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "PyMySQL==1.1.1",
    "redis==5.2.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mysql: tests that require a running local MySQL container",
]
